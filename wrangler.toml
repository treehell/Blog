# Cloudflare Workers 配置（静态资源 + /api Worker）。
name = "treemoe-blog"
main = "worker/index.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /archives/xxx 自动补成 /archives/xxx/；找不到的路径返回 dist/404.html（旧链接跳转脚本在里面）
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# 只有接口请求进 Worker，页面和图片直接由静态资源返回，不计 Worker 调用次数
run_worker_first = ["/api/*"]

[vars]
# R2 对外访问的 CDN 域名：上传后返回的地址、以及正文里被替换成的域名
CDN_BASE = "https://oss.treemoe.cn"
# 正文里出现这些 R2 原始域名时，保存时自动替换为 CDN_BASE（逗号分隔，可留空）
# 例如 "pub-xxxxxxxx.r2.dev,<账户ID>.r2.cloudflarestorage.com/<桶名>"
R2_PUBLIC_HOSTS = ""
ADMIN_USER = "admin"

# 以下为密钥，不要写在这里：在 Worker 的「设置 → 变量和机密」里添加，或用
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET      （任意 32 位以上随机字符串）
#   npx wrangler secret put DEPLOY_HOOKS        （两个平台的 Deploy Hook 地址，逗号分隔）

[[d1_databases]]
binding = "DB"
database_name = "treemoe-blog"
database_id = "47ae5571-3dee-4b2d-9059-59e1309770eb"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "treemoe"
